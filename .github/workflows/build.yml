name: Build MO2

# One workflow for the whole project. Of the per-repo workflows, 24 are named
# build.yml and 18 drive mob through ModOrganizer2/build-with-mob-action@master,
# which builds against UPSTREAM's mob rather than our fork -- so they cannot
# verify this tree without that action being forked first. This one has no such
# dependency: clone, configure, build, install, verify. It is intended to prove
# something per-repo CI never does, that the repositories build *together* at the
# commits the gitlinks name.
#
# It has run, and it has already paid for itself once. Three workflow_dispatch runs
# on 2026-08-11, all picked up by the runner within seconds of being queued:
#
#   31518812267  e468982  FAILED at Configure -- the missing qtwebsockets and
#                         qtnetworkauth, four months undetected because every local
#                         machine already had a fuller Qt. Fixed in ecb0de0. This is
#                         the run that justifies the workflow existing.
#   31522069038  ecb0de0  succeeded, but with the removed x-gha cache backend, so it
#                         built all 112 packages from source while reporting success
#   31526808970  3b72f46  succeeded, 57 minutes, with the `files` cache below
#
#   31891530170  e118e84  succeeded, 41 minutes, 2026-08-15 -- the first run of the
#                         Qt-pin and install-tree-verification steps, which had been
#                         added four days earlier and never executed. It reported
#                         30 plugins / 9 image plugins / 29 stylesheets / 18 licences
#
# ⚠️ There is still no `push` trigger on branches, only on `v*` tags, so a commit on
# main is NOT checked automatically. Whatever HEAD is, it is likely ahead of the last
# CI-tested commit -- check the run list before repeating any claim that CI verifies
# this tree.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # only used by the release steps at the end

# Deliberately NOT `push: branches: [main]` yet. The warm cost is now measured -- run
# 31891530170 took 41 minutes with warm Qt and vcpkg caches, and that included a full
# usvfs rebuild that will not recur -- so the objection is no longer "unknown cost".
# It is that a stream of green runs on every commit proves little for a project with
# one maintainer. Revisit when someone else is pushing to this repository.
#
# The `v*` tag trigger is different: a tag means a release, and a release must be the
# build that the verification below just checked.

jobs:
  build:
    # NOT windows-2025: that image is Visual Studio Enterprise 2022 17.14 with
    # toolsets v142/v143 only, and this tree needs v145. This label is VS
    # Enterprise 2026 18.8 with v145 14.51.36247 and CMake 4.4.2, which is our
    # exact pin. There is no windows-2026 image.
    runs-on: windows-2025-vs2026
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history, not the default depth-1: the release notes derive their
          # changelog from `git log <previous tag>..HEAD`, and a shallow clone has
          # neither the tags nor the commits to compare against.
          fetch-depth: 0

      # The tag does NOT define the version -- version.rc does. This step exists so
      # that a mistyped tag fails here rather than producing artifacts named after a
      # version the binaries do not report. Same rule as the Qt pin above: derive it,
      # never restate it.
      - name: Check the tag against version.rc
        id: ver
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $rc  = Get-Content repos/modorganizer/src/version.rc -Raw
          $str = [regex]::Match($rc, 'VER_FILEVERSION_STR\s+"([0-9.]+)').Groups[1].Value
          if (-not $str) {
            throw "Could not read VER_FILEVERSION_STR from repos/modorganizer/src/version.rc. If it was renamed, update this step."
          }
          if ($tag -ne $str) {
            throw "Tag v$tag does not match version.rc ($str). version.rc is the source of truth -- bump it, commit, then re-tag."
          }
          "version=$tag" | Out-File $env:GITHUB_OUTPUT -Append

          # Packaging needs 7z, and it runs 40 minutes from now. Check it here so a
          # runner image without it costs seconds rather than a whole build.
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw "7z is not on PATH on this runner; the Package step would fail after the build."
          }
          Write-Host "Releasing $str"

      # The tree is pinned to 3.14; this image defaults to 3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # vcpkg's own binary cache, carried by actions/cache.
      #
      # NOT x-gha. That backend has been REMOVED from vcpkg -- run 31522069038
      # passed "clear;x-gha,readwrite", got
      #   warning: The 'x-gha' binary caching backend has been removed
      # and then built all 112 packages from source while reporting success. The
      # environment was fine; the backend is gone.
      #
      # The `files` provider is content-addressed by vcpkg's own ABI hash, which
      # already includes the compiler version, so a key that is stale in some way
      # we did not anticipate costs a cache miss and never a wrong binary.
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-vs2026-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-vs2026-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-vs2026-

      # usvfs is built at CONFIGURE time, both architectures, each a full nested
      # CMake project with its own vcpkg manifest -- including an entire x86
      # dependency set the main build never needs. Locally that is 1.9 GB of
      # build trees producing an 83 MB install.
      #
      # The skip-guard is build/usvfs-install/.mo2-usvfs-complete, whose CONTENTS
      # record the generator, toolset and triplets that produced it -- so a
      # restore across a toolchain change rebuilds rather than being reused
      # silently. A fresh runner misses it and pays the cost on every run, unlike
      # vcpkg whose cost the cache above removes.
      #
      # The key is the usvfs gitlink itself, so it changes exactly when usvfs
      # does. It must also carry the toolset and image: the guard tests only that
      # the file EXISTS, not what built it, so a cache restored across a compiler
      # change would be used silently.
      - name: usvfs revision
        id: usvfs
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD:repos/usvfs)" >> $env:GITHUB_OUTPUT

      - name: Cache built usvfs
        uses: actions/cache@v6
        with:
          path: build/usvfs-install
          key: usvfs-${{ steps.usvfs.outputs.sha }}-v145-${{ runner.os }}-vs2026

      # There is deliberately no "Install Qt" step: configure downloads Qt itself
      # when it cannot find it, into exactly this directory, so the cache below
      # only has to make that download optional. CI therefore exercises the same
      # acquisition path a contributor gets rather than a copy of it.
      #
      # The pin is READ from CMakeLists.txt rather than repeated here. A second
      # copy would drift, and the failure is nasty: a key built from a stale copy
      # restores a Qt that does not match what configure then asks for, so the
      # run dies on a directory nobody created. Hashing the module list into the
      # key also removes the manual "remember to bump the suffix" rule that the
      # previous version of this step relied on -- changing MO2_QT_MODULES now
      # invalidates the cache by construction.
      - name: Read the Qt pin from CMakeLists.txt
        id: qt
        shell: pwsh
        run: |
          $cml = Get-Content CMakeLists.txt -Raw
          $q = [char]34
          $ver  = [regex]::Match($cml, "set\(MO2_QT_VERSION $q([^$q]+)$q").Groups[1].Value
          $arch = [regex]::Match($cml, "set\(MO2_QT_ARCH $q([^$q]+)$q").Groups[1].Value
          $mods = [regex]::Match($cml, '(?s)set\(MO2_QT_MODULES(.*?)CACHE').Groups[1].Value
          if (-not $ver -or -not $arch -or -not $mods) {
            throw "Could not read the Qt pin from CMakeLists.txt. If those variables were renamed, update this step."
          }
          $sha = [Security.Cryptography.SHA256]::Create()
          $modHash = [BitConverter]::ToString(
            $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($mods))).Replace('-','').Substring(0,12)
          "version=$ver"     | Out-File $env:GITHUB_OUTPUT -Append
          "arch=$arch"       | Out-File $env:GITHUB_OUTPUT -Append
          "modhash=$modHash" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Qt $ver $arch, module-list hash $modHash"

      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: qt
          # No restore-keys on purpose. A partial match would restore a Qt built
          # from a different module list, which is precisely the silent failure
          # this key exists to prevent.
          key: qt-${{ steps.qt.outputs.version }}-${{ steps.qt.outputs.arch }}-${{ steps.qt.outputs.modhash }}

      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"
        run: cmake --preset vs2026

      - name: Build
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo

      - name: Install
        shell: pwsh
        run: cmake --install build --config RelWithDebInfo

      # docs/TRAPS.md: "Assert on install/bin/ModOrganizer.exe, never on the
      # build's exit code." Without this step the workflow could not detect the
      # failure it exists to catch -- a green build that deploys nothing --
      # because upload-artifact warns rather than fails on an empty path.
      #
      # The image-plugin count is here for a different reason: a Qt installed
      # without qtimageformats produces 4 plugins instead of 9 and nothing fails
      # at build time. MO2 then silently cannot render TGA, TIFF or WebP mod
      # previews. This is the only automated check in the project that can see
      # that class of regression at all.
      - name: Verify the install tree
        shell: pwsh
        run: |
          $errors = @()
          function Require($path, $what) {
            if (-not (Test-Path $path)) { $script:errors += "missing $what : $path" }
          }
          Require 'install/bin/ModOrganizer.exe'          'the application'
          Require 'install/bin/uibase.dll'                'uibase'
          Require 'install/bin/usvfs_x64.dll'             'usvfs (x64)'
          Require 'install/bin/usvfs_x86.dll'             'usvfs (x86)'
          Require 'install/bin/usvfs_proxy_x64.exe'       'the usvfs x64 proxy'
          Require 'install/bin/usvfs_proxy_x86.exe'       'the usvfs x86 proxy'
          Require 'install/bin/platforms/qwindows.dll'    'the Qt platform plugin'
          Require 'install/bin/dlls/Qt6Core.dll'          'the Qt runtime'

          $exe = Get-Item 'install/bin/ModOrganizer.exe' -ErrorAction SilentlyContinue
          if ($exe -and $exe.Length -lt 1MB) { $errors += "ModOrganizer.exe is implausibly small ($($exe.Length) bytes)" }

          $plugins = @(Get-ChildItem 'install/bin/plugins' -Filter *.dll -ErrorAction SilentlyContinue)
          if ($plugins.Count -lt 30) { $errors += "expected 30 MO2 plugins, found $($plugins.Count)" }

          $img = @(Get-ChildItem 'install/bin/dlls/imageformats' -Filter *.dll -ErrorAction SilentlyContinue)
          if ($img.Count -lt 9) {
            $errors += "expected 9 Qt image plugins, found $($img.Count) -- qtimageformats is probably missing from MO2_QT_MODULES"
          }

          $stylesheets = @(Get-ChildItem 'install/bin/stylesheets' -ErrorAction SilentlyContinue)
          # 29 entries, from the 9 releases in the stylesheet table. Asserting >= 1
          # on a quantity that is known would pass with 28 of them missing.
          if ($stylesheets.Count -lt 29) { $errors += "expected 29 deployed stylesheet entries, found $($stylesheets.Count)" }

          # Derived from the source directory rather than hardcoded: this repository
          # owns licenses/, so a count written here would be a second copy of a fact
          # one `git add` away from changing.
          $expectedLicenses = @(Get-ChildItem 'licenses' -File).Count
          $licenses = @(Get-ChildItem 'install/bin/licenses' -ErrorAction SilentlyContinue)
          if ($licenses.Count -lt $expectedLicenses) {
            $errors += "expected $expectedLicenses third-party licence texts (one per file in licenses/), found $($licenses.Count)"
          }

          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            throw "The install tree is incomplete; $($errors.Count) check(s) failed."
          }
          Write-Host "Install tree verified: $($plugins.Count) plugins, $($img.Count) image plugins, $($stylesheets.Count) stylesheet entries, $($licenses.Count) licence texts."

      - uses: actions/upload-artifact@v7
        with:
          name: ModOrganizer2
          path: install/bin
          if-no-files-found: error

      # --- release, only on a v* tag ----------------------------------------------
      # These steps live in THIS workflow rather than a second one on purpose: a
      # release has to be the same build the verification above just passed. A
      # separate release workflow would be a second copy of the build logic, and
      # duplicated facts drifting apart is the recurring bug in this project.

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null

          # Names mirror upstream's release assets so they are recognisable.
          7z a -t7z -mx=9 "dist/Mod.Organizer-$v.7z"        ".\install\bin\*"     | Out-Null
          7z a -t7z -mx=9 "dist/Mod.Organizer-$v-pdbs.7z"   ".\install\pdb\*"     | Out-Null
          7z a -t7z -mx=9 "dist/Mod.Organizer-$v-uibase.7z" ".\install\include\*" ".\install\lib\*" | Out-Null

          # commits.txt records the exact gitlink of all 34 repositories. Upstream
          # ships a flat commit list; this is more useful, because these 34 lines plus
          # this repository are the complete recipe for reproducing the build -- and
          # they are what makes the GPL source offer concrete rather than nominal.
          $out = @(
            "Mod Organizer $v"
            "superbuild: https://github.com/${{ github.repository }} @ ${{ github.sha }}"
            ""
            "Repositories (submodule gitlinks):"
          )
          $out += git submodule status | ForEach-Object {
            if ($_ -match '^\s*.?([0-9a-f]{40})\s+(\S+)') { "  {0}  {1}" -f $matches[1], $matches[2] }
          }
          $out | Set-Content "dist/Mod.Organizer-$v-commits.txt" -Encoding utf8

          Get-ChildItem dist | ForEach-Object { "{0,-45} {1,8:N1} MB" -f $_.Name, ($_.Length/1MB) }

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"

          # Built as an array rather than a here-string: PowerShell requires the "@
          # terminator at column 0, and YAML requires block-scalar content indented.
          # The two cannot both be satisfied. Markdown code spans are avoided for the
          # same class of reason -- backtick is PowerShell's escape character.
          $notes = @(
            "Mod Organizer $v -- a build of the [mo2-modern](https://github.com/mo2-modern) fork."
            ""
            "**This is not an official Mod Organizer 2 release.** Report problems here, not to upstream."
            ""
            "Built from source by [mo2-superbuild](https://github.com/${{ github.repository }}) on VS2026 / v145 / Qt 6.11.1 / Python 3.14."
            ""
            "### Changes"
            ""
          )

          # Derived from git, not written by hand, so it cannot drift from what
          # shipped. Defensive on purpose: if the previous tag cannot be resolved
          # this degrades to a pointer at the compare view rather than failing the
          # release after a 40-minute build.
          $prev = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $notes += git log --no-merges --format="- %s" "$prev..${{ github.ref_name }}"
            $notes += ""
            $notes += "[Full diff since $prev](https://github.com/${{ github.repository }}/compare/$prev...${{ github.ref_name }})"
          } else {
            $notes += "- see the commit history"
          }

          $notes += @(
            ""
            "### Downloads"
            ""
            "| File | What |"
            "|---|---|"
            "| **Mod.Organizer-$v.7z** | the portable build -- extract it and run ModOrganizer.exe |"
            "| Mod.Organizer-$v-pdbs.7z | debug symbols, only needed for diagnosing a crash |"
            "| Mod.Organizer-$v-uibase.7z | uibase headers and import libraries, for plugin authors |"
            "| Mod.Organizer-$v-commits.txt | the exact commit of every repository in this build, and of the vcpkg pin |"
            ""
            "There is **no installer**. The portable archive is the only build -- upstream's installer is produced by a repository this project does not fork."
            ""
            "### Source"
            ""
            "GPL-3.0. Every repository is public under [mo2-modern](https://github.com/mo2-modern), and commits.txt names the exact commit each component was built from."
          )
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes | Set-Content $notesFile -Encoding utf8

          # dist/ holds only assets -- the notes deliberately live outside it.
          $assets = Get-ChildItem dist | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $assets --title "Mod Organizer $v" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
