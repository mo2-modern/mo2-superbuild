name: Build MO2

# One workflow for the whole project. The 33 per-repo build.yml files each drive
# mob through ModOrganizer2/build-with-mob-action@master, which builds against
# UPSTREAM's mob rather than our fork -- so they cannot verify this tree without
# that action being forked first. The superbuild has no such dependency: clone,
# configure, build. It also proves something per-repo CI never does, that the 34
# repositories build *together* at the commits the gitlinks name.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Deliberately NOT `push: branches: [main]` while this is unproven -- a cold run
# is ~112 vcpkg packages plus a full MO2 build. Turn it on once a warm cache has
# shown the incremental cost.

env:
  MO2_QT_VERSION: "6.11.1"
  MO2_QT_ARCH: "msvc2022_64"

jobs:
  build:
    # NOT windows-2025: that image is Visual Studio Enterprise 2022 17.14 with
    # toolsets v142/v143 only, and this tree needs v145. This label is VS
    # Enterprise 2026 18.8 with v145 14.51.36247 and CMake 4.4.2, which is our
    # exact pin. There is no windows-2026 image.
    runs-on: windows-2025-vs2026
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The tree is pinned to 3.14; this image defaults to 3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # vcpkg's own binary cache, carried by actions/cache.
      #
      # NOT x-gha. That backend has been REMOVED from vcpkg -- run 31522069038
      # passed "clear;x-gha,readwrite", got
      #   warning: The 'x-gha' binary caching backend has been removed
      # and then built all 112 packages from source while reporting success. The
      # environment was fine; the backend is gone.
      #
      # The `files` provider is content-addressed by vcpkg's own ABI hash, which
      # already includes the compiler version, so a key that is stale in some way
      # we did not anticipate costs a cache miss and never a wrong binary.
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-vs2026-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-vs2026-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-vs2026-

      # usvfs is built at CONFIGURE time, both architectures, each a full nested
      # CMake project with its own vcpkg manifest -- including an entire x86
      # dependency set the main build never needs. Locally that is 1.9 GB of
      # build trees producing an 83 MB install.
      #
      # The skip-guard is the existence of usvfs-install/lib/cmake/usvfs/
      # usvfsConfig.cmake in the build tree, so a fresh runner always misses it
      # and pays the cost on every single run, unlike vcpkg whose cost the cache
      # above removes.
      #
      # The key is the usvfs gitlink itself, so it changes exactly when usvfs
      # does. It must also carry the toolset and image: the guard tests only that
      # the file EXISTS, not what built it, so a cache restored across a compiler
      # change would be used silently.
      - name: usvfs revision
        id: usvfs
        shell: pwsh
        run: echo "sha=$(git rev-parse HEAD:repos/usvfs)" >> $env:GITHUB_OUTPUT

      - name: Cache built usvfs
        uses: actions/cache@v6
        with:
          path: build/usvfs-install
          key: usvfs-${{ steps.usvfs.outputs.sha }}-v145-${{ runner.os }}-vs2026

      # Qt is the one prerequisite the project cannot provide for itself: it
      # needs WebEngine, which vcpkg would have to build Chromium for. The
      # superbuild looks for it at ./qt/<version>/<arch>, which is exactly the
      # layout `aqt -O qt` produces.
      # There is deliberately NO "Install Qt" step. Configure installs Qt itself
      # when it cannot find it (MO2_AUTO_INSTALL_QT, on by default), into exactly
      # this directory, so all this cache has to do is make the download optional.
      #
      # That is worth more than the few minutes it saves: CI now exercises the
      # same acquisition path a contributor gets, rather than a hand-maintained
      # copy of it. This step used to carry its own duplicate of the Qt module
      # list -- the fourth copy in the tree -- and duplication of exactly this
      # list is what cost four months when two modules went missing from the
      # copies (see docs/TRAPS.md). The single copy now lives in MO2_QT_MODULES
      # in CMakeLists.txt, and both the download and the printed instructions
      # derive from it.
      #
      # A cache saved with a shorter module list would restore happily and then
      # fail configure on a missing component, so the key still needs bumping
      # when MO2_QT_MODULES changes.
      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: qt
          key: qt-${{ env.MO2_QT_VERSION }}-${{ env.MO2_QT_ARCH }}-mods2-v2

      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"
        run: cmake --preset vs2026

      - name: Build
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo

      - name: Install
        shell: pwsh
        run: cmake --install build --config RelWithDebInfo

      - uses: actions/upload-artifact@v7
        with:
          name: ModOrganizer2
          path: install/bin
